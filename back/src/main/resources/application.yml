spring:
  application:
    name: limpacity-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/limpacity}
    username: ${DATABASE_USERNAME:limpacity}
    password: ${DATABASE_PASSWORD:limpacity_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
